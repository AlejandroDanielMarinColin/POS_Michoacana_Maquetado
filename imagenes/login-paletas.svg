      <rect x="245" y="735" width="62" height="260" rx="28" fill="#d7a05f"/>
      <circle cx="205" cy="245" r="52" fill="#fff" opacity=".24"/>
      <circle cx="305" cy="390" r="48" fill="#f5efe5"/>
      <circle cx="305" cy="390" r="37" fill="#8ccf4c"/>
      <circle cx="305" cy="390" r="7" fill="#253b1d"/>
      <g fill="#253b1d">
        <circle cx="305" cy="362" r="4"/><circle cx="329" cy="377" r="4"/><circle cx="326" cy="405" r="4"/><circle cx="282" cy="377" r="4"/><circle cx="282" cy="404" r="4"/>
      </g>
      <path d="M155 540c90-75 195-80 280-20-20 150-100 225-225 225-70-45-95-118-55-205z" fill="#ff5a72" opacity=".88"/>
      <circle cx="235" cy="610" r="7" fill="#ffd6bf"/><circle cx="284" cy="650" r="6" fill="#ffd6bf"/><circle cx="330" cy="585" r="6" fill="#ffd6bf"/>
    </g>

    <g transform="translate(465 120) rotate(4 220 430)">
      <rect x="95" y="115" width="355" height="705" rx="165" fill="url(#pink)"/>
      <rect x="245" y="795" width="62" height="270" rx="28" fill="#d9a663"/>
      <ellipse cx="205" cy="280" rx="52" ry="78" fill="#fff" opacity=".2"/>
      <g fill="#ffd3df" opacity=".8">
        <circle cx="180" cy="470" r="10"/><circle cx="270" cy="530" r="8"/><circle cx="330" cy="420" r="9"/><circle cx="220" cy="650" r="7"/><circle cx="370" cy="670" r="8"/>
      </g>
    </g>

    <g transform="translate(765 300) rotate(11 220 430)">
