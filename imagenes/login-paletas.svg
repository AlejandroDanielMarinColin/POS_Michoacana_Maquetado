<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Paletas mexicanas</title>
  <desc id="desc">Composición colorida de paletas de fruta para el acceso de La Michoacana</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4f8"/>
      <stop offset="0.52" stop-color="#ffdce9"/>
      <stop offset="1" stop-color="#ffc9df"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff77b8"/>
      <stop offset="1" stop-color="#e91e78"/>
    </linearGradient>
    <linearGradient id="mango" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd85a"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9e769"/>
      <stop offset="1" stop-color="#62b84d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#8a315b" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect width="1200" height="1600" fill="url(#bg)"/>
  <circle cx="1030" cy="180" r="240" fill="#ed2b85" opacity=".08"/>
  <circle cx="140" cy="1460" r="310" fill="#ffd43b" opacity=".18"/>

  <g filter="url(#shadow)">
