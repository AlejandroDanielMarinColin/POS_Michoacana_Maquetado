<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Iniciar sesión | La Michoacana</title>
<link rel="stylesheet" href="estilos/login-pc.css">
<style>
:root{--rosa:#ed2b85;--rosa2:#d91c70;--negro:#19151d;--gris:#706a73;--borde:#e8e1e7}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100dvh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--negro);background:#fff}button,input{font:inherit}
.login{min-height:100dvh;display:grid;grid-template-columns:minmax(420px,48%) 1fr}
.login-imagen{position:relative;min-height:100dvh;overflow:hidden;display:flex;padding:clamp(36px,5vw,72px);color:#fff;background-image:linear-gradient(180deg,rgba(38,10,26,.06),rgba(38,10,26,.16) 50%,rgba(38,10,26,.62)),url("https://images.unsplash.com/photo-1606169109553-aa8c5e4a62b9");background-size:cover;background-position:center}
.login-imagen:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(237,43,133,.08),transparent 52%);pointer-events:none}.contenido-imagen{position:relative;z-index:1;width:100%;display:flex;flex-direction:column}.copy-hero{margin-top:auto;max-width:570px}.titulo-marca{margin:0;font-size:clamp(3rem,5.3vw,6rem);line-height:.9;letter-spacing:-.06em;font-weight:900;text-shadow:0 4px 24px rgba(0,0,0,.22)}.titulo-marca span{color:#ff7fba}.frase-principal{margin:22px 0 0;max-width:440px;font-size:clamp(1rem,1.25vw,1.2rem);line-height:1.55;color:rgba(255,255,255,.94);text-shadow:0 2px 14px rgba(0,0,0,.24)}.detalle-amarillo{width:72px;height:6px;margin-top:22px;border-radius:99px;background:#ffd43b}.frase-inferior{margin:18px 0 0;font-weight:700;color:rgba(255,255,255,.88)}
.login-acceso{min-height:100dvh;padding:clamp(36px,6vw,84px);display:flex;align-items:center;justify-content:center}.formulario{width:100%;max-width:500px}.logo{display:flex;justify-content:center;margin-bottom:22px}.logo-imagen{width:118px;height:118px;display:block;object-fit:contain;border-radius:24px;background:#fff;box-shadow:0 12px 30px rgba(38,24,33,.08)}h2{margin:0;text-align:center;font-size:clamp(1.85rem,2.7vw,2.3rem);letter-spacing:-.04em}.instruccion{margin:11px auto 32px;color:var(--gris);text-align:center;line-height:1.5}.etiqueta-campo{display:block;margin-bottom:10px;font-size:.88rem;font-weight:800}.codigo{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}.codigo input{width:100%;min-width:0;height:62px;padding:0;border:1.5px solid var(--borde);border-radius:14px;outline:0;text-align:center;font-size:1.32rem;font-weight:850;caret-color:var(--rosa);transition:.18s}.codigo input:focus{border-color:var(--rosa);box-shadow:0 0 0 4px #fff1f7;transform:translateY(-1px)}.ayuda{margin:10px 0 24px;color:var(--gris);font-size:.8rem}.boton{width:100%;min-height:56px;border:0;border-radius:14px;color:#fff;background:linear-gradient(135deg,var(--rosa),var(--rosa2));font-weight:850;cursor:pointer;box-shadow:0 12px 26px rgba(237,43,133,.22)}.mensaje-error{min-height:21px;margin:11px 0 0;color:#c8234d;font-size:.82rem}.pie-login{margin:28px 0 0;color:#9b949b;text-align:center;font-size:.8rem}
@media(max-width:980px){.login{grid-template-columns:1fr}.login-imagen{min-height:310px;padding:30px 7vw 34px;background-position:center 44%}.copy-hero{max-width:72%}.titulo-marca{font-size:clamp(2.6rem,7vw,4.2rem)}.frase-principal{margin-top:13px;font-size:.98rem}.frase-inferior{display:none}.login-acceso{min-height:auto;padding:48px 8vw 58px}.formulario{max-width:540px}}
@media(max-width:600px){html,body{background:#fff8fb}body{min-height:100dvh;overflow-x:hidden}.login{display:block;min-height:100dvh;background:#fff8fb;overflow:hidden}.login-imagen{position:relative;width:100%;height:34vh;min-height:240px;max-height:320px;padding:0;background-position:center 35%;border-radius:0 0 52% 52% / 0 0 16% 16%;box-shadow:0 14px 34px rgba(218,73,139,.10)}.login-imagen:after{background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(236,43,133,.05))}.contenido-imagen,.copy-hero{display:none}.login-acceso{min-height:auto;padding:0 24px 30px;background:#fff8fb;display:block}.formulario{width:100%;max-width:420px;margin:0 auto;padding:34px 0 0;background:transparent}.logo{margin:0 0 16px;justify-content:center}.logo-imagen{width:96px;height:96px;border-radius:0;background:transparent;box-shadow:none;object-fit:contain}h2{font-size:2rem;line-height:1.08;letter-spacing:-.045em}.instruccion{margin:10px auto 30px;max-width:310px;font-size:.94rem;line-height:1.45;color:#827a84}.etiqueta-campo{margin-bottom:10px;font-size:.92rem}.codigo{gap:7px}.codigo input{height:54px;border-radius:13px;border:1.5px solid #e3dce1;background:#fff;font-size:1.08rem;box-shadow:0 2px 8px rgba(34,20,29,.025)}.codigo input:focus{border-color:var(--rosa);box-shadow:0 0 0 4px rgba(237,43,133,.09);transform:none}.ayuda{margin:10px 0 24px;font-size:.78rem;color:#918992}.boton{min-height:56px;border-radius:14px;font-size:1rem;box-shadow:0 12px 24px rgba(237,43,133,.20)}.mensaje-error{min-height:20px;margin-top:10px;font-size:.78rem}.pie-login{margin:26px 0 0;padding-bottom:max(8px,env(safe-area-inset-bottom));font-size:.76rem;color:#9d969d}}
@media(max-width:380px){.login-imagen{height:31vh;min-height:210px;border-radius:0 0 50% 50% / 0 0 14% 14%;background-position:center 34%}.login-acceso{padding:0 18px 22px}.formulario{padding-top:26px}.logo-imagen{width:80px;height:80px}h2{font-size:1.72rem}.instruccion{margin-bottom:24px;font-size:.86rem}.codigo{gap:5px}.codigo input{height:47px;border-radius:11px;font-size:1rem}.boton{min-height:52px}}
</style>
</head>
<body>
<main class="login">
<section class="login-imagen"><div class="contenido-imagen"><div class="copy-hero"><h1 class="titulo-marca">La<br><span>Michoacana</span></h1><p class="frase-principal">Tradición, sabor y una operación más simple para administrar tu negocio todos los días.</p><div class="detalle-amarillo"></div><p class="frase-inferior">Más que paletas, es tradición.</p></div></div></section>
<section class="login-acceso"><form class="formulario" id="formularioLogin"><div class="logo"><img src="imagenes/logogranpaleteria.jpeg" alt="Logo de Gran Paletería Michoacana" class="logo-imagen"></div><h2>Iniciar sesión</h2><p class="instruccion">Ingresa tu código de acceso para continuar.</p><label class="etiqueta-campo" for="digito1">Código de acceso</label><div class="codigo"><input id="digito1" type="password" inputmode="numeric" autocomplete="one-time-code" maxlength="1" required autofocus><input type="password" inputmode="numeric" maxlength="1" required><input type="password" inputmode="numeric" maxlength="1" required><input type="password" inputmode="numeric" maxlength="1" required><input type="password" inputmode="numeric" maxlength="1" required><input type="password" inputmode="numeric" maxlength="1" required></div><p class="ayuda">Código numérico de 6 dígitos</p><button class="boton" type="submit">Iniciar sesión &nbsp;→</button><p class="mensaje-error" id="mensajeError"></p><p class="pie-login">Acceso exclusivo para personal autorizado</p></form></section>
</main>
<script src="scripts/login.js"></script>
</body>
</html>
