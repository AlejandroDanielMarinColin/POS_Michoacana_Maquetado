<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Iniciar sesión | La Michoacana</title>
<style>
:root{--rosa:#ed2b85;--rosa2:#d91c70;--amarillo:#ffd43b;--negro:#19151d;--gris:#706a73;--borde:#e8e1e7}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{min-height:100dvh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--negro);background:#fff}button,input{font:inherit}
.login{min-height:100dvh;display:grid;grid-template-columns:minmax(420px,48%) 1fr}
.login-imagen{position:relative;min-height:100dvh;overflow:hidden;display:flex;padding:clamp(36px,5vw,72px);color:#fff;background-image:linear-gradient(180deg,rgba(38,10,26,.06),rgba(38,10,26,.16) 50%,rgba(38,10,26,.62)),url("https://images.unsplash.com/photo-1606169109553-aa8c5e4a62b9");background-size:cover;background-position:center}
.login-imagen:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(237,43,133,.08),transparent 52%);pointer-events:none}.contenido-imagen{position:relative;z-index:1;width:100%;display:flex;flex-direction:column}.copy-hero{margin-top:auto;max-width:570px}.titulo-marca{margin:0;font-size:clamp(3rem,5.3vw,6rem);line-height:.9;letter-spacing:-.06em;font-weight:900;text-shadow:0 4px 24px rgba(0,0,0,.22)}.titulo-marca span{color:#ff7fba}.frase-principal{margin:22px 0 0;max-width:440px;font-size:clamp(1rem,1.25vw,1.2rem);line-height:1.55;color:rgba(255,255,255,.94);text-shadow:0 2px 14px rgba(0,0,0,.24)}.detalle-amarillo{width:72px;height:6px;margin-top:22px;border-radius:99px;background:var(--amarillo)}.frase-inferior{margin:18px 0 0;font-weight:700;color:rgba(255,255,255,.88)}
.login-acceso{min-height:100dvh;padding:clamp(36px,6vw,84px);display:flex;align-items:center;justify-content:center}.formulario{width:100%;max-width:500px}.logo{display:flex;justify-content:center;margin-bottom:22px}.logo-imagen{width:118px;height:118px;display:block;object-fit:contain;border-radius:24px;background:#fff;box-shadow:0 12px 30px rgba(38,24,33,.08)}h2{margin:0;text-align:center;font-size:clamp(1.85rem,2.7vw,2.3rem);letter-spacing:-.04em}.instruccion{margin:11px auto 32px;color:var(--gris);text-align:center;line-height:1.5}.etiqueta-campo{display:block;margin-bottom:10px;font-size:.88rem;font-weight:800}.codigo{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px}.codigo input{width:100%;min-width:0;height:62px;padding:0;border:1.5px solid var(--borde);border-radius:14px;outline:0;text-align:center;font-size:1.32rem;font-weight:850;caret-color:var(--rosa);transition:.18s}.codigo input:focus{border-color:var(--rosa);box-shadow:0 0 0 4px #fff1f7;transform:translateY(-1px)}.ayuda{margin:10px 0 24px;color:var(--gris);font-size:.8rem}.boton{width:100%;min-height:56px;border:0;border-radius:14px;color:#fff;background:linear-gradient(135deg,var(--rosa),var(--rosa2));font-weight:850;cursor:pointer;box-shadow:0 12px 26px rgba(237,43,133,.22)}.mensaje-error{min-height:21px;margin:11px 0 0;color:#c8234d;font-size:.82rem}.pie-login{margin:28px 0 0;color:#9b949b;text-align:center;font-size:.8rem}
@media(max-width:980px){.login{grid-template-columns:1fr}.login-imagen{min-height:310px;padding:30px 7vw 34px;background-position:center 44%}.copy-hero{max-width:72%}.titulo-marca{font-size:clamp(2.6rem,7vw,4.2rem)}.frase-principal{margin-top:13px;font-size:.98rem}.frase-inferior{display:none}.login-acceso{min-height:auto;padding:48px 8vw 58px}.formulario{max-width:540px}}
@media(max-width:600px){.login-imagen{min-height:205px;padding:20px 20px 24px;border-radius:0 0 26px 26px;background-position:center 40%}.copy-hero{max-width:100%}.titulo-marca{font-size:clamp(2rem,10vw,2.8rem)}.frase-principal{display:none}.detalle-amarillo{width:52px;height:5px;margin-top:12px}.login-acceso{padding:32px 20px max(32px,env(safe-area-inset-bottom));align-items:flex-start}.logo{margin-bottom:17px}.logo-imagen{width:86px;height:86px;border-radius:19px}h2{font-size:1.72rem}.instruccion{margin-bottom:25px;font-size:.9rem}.codigo{gap:6px}.codigo input{height:51px;border-radius:11px;font-size:1.1rem}.boton{min-height:54px}}
@media(max-width:380px){.login-imagen{min-height:180px}.titulo-marca{font-size:1.95rem}.codigo{gap:4px}.codigo input{height:47px;border-radius:9px;font-size:1rem}}
</style>
</head>
<body>
<main class="login">
<section class="login-imagen" aria-label="Bienvenida a La Michoacana"><div class="contenido-imagen"><div class="copy-hero"><h1 class="titulo-marca">La<br><span>Michoacana</span></h1><p class="frase-principal">Tradición, sabor y una operación más simple para administrar tu negocio todos los días.</p><div class="detalle-amarillo"></div><p class="frase-inferior">Más que paletas, es tradición.</p></div></div></section>
<section class="login-acceso"><form class="formulario" id="formularioLogin"><div class="logo"><img src="imagenes/logogranpaleteria.jpeg" alt="Logo de Gran Paletería Michoacana" class="logo-imagen"></div><h2>Iniciar sesión</h2><p class="instruccion">Ingresa tu código de acceso para continuar.</p><label class="etiqueta-campo" for="digito1">Código de acceso</label><div class="codigo" aria-label="Código de acceso de seis dígitos"><input id="digito1" type="password" inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="Dígito 1" required autofocus><input type="password" inputmode="numeric" maxlength="1" aria-label="Dígito 2" required><input type="password" inputmode="numeric" maxlength="1" aria-label="Dígito 3" required><input type="password" inputmode="numeric" maxlength="1" aria-label="Dígito 4" required><input type="password" inputmode="numeric" maxlength="1" aria-label="Dígito 5" required><input type="password" inputmode="numeric" maxlength="1" aria-label="Dígito 6" required></div><p class="ayuda">Código numérico de 6 dígitos</p><button class="boton" type="submit">Iniciar sesión &nbsp;→</button><p class="mensaje-error" id="mensajeError" aria-live="polite"></p><p class="pie-login">Acceso exclusivo para personal autorizado</p></form></section>
</main>
<script>
const formulario=document.getElementById("formularioLogin");const campos=[...document.querySelectorAll(".codigo input")];const mensajeError=document.getElementById("mensajeError");campos.forEach((campo,posicion)=>{campo.addEventListener("input",()=>{campo.value=campo.value.replace(/\D/g,"");if(campo.value&&campos[posicion+1])campos[posicion+1].focus();mensajeError.textContent=""});campo.addEventListener("keydown",evento=>{if(evento.key==="Backspace"&&!campo.value&&campos[posicion-1])campos[posicion-1].focus();if(evento.key==="ArrowLeft"&&campos[posicion-1])campos[posicion-1].focus();if(evento.key==="ArrowRight"&&campos[posicion+1])campos[posicion+1].focus()});campo.addEventListener("paste",evento=>{evento.preventDefault();const numeros=evento.clipboardData.getData("text").replace(/\D/g,"").slice(0,6);numeros.split("").forEach((numero,indice)=>{if(campos[indice])campos[indice].value=numero});const siguiente=campos[Math.min(numeros.length,5)];if(siguiente)siguiente.focus()})});formulario.addEventListener("submit",evento=>{evento.preventDefault();const codigo=campos.map(c=>c.value).join("");if(codigo.length!==6){mensajeError.textContent="Ingresa los seis números del código.";return}const usuariosPrueba={"123456":{id:1,nombre:"Administrador",rol:"ADMINISTRADOR",sucursal:{id:1,nombre:"Matriz · Zitácuaro"}},"654321":{id:2,nombre:"Carlos Mendoza",rol:"EMPLEADO",sucursal:{id:1,nombre:"Matriz · Zitácuaro"}}};const usuario=usuariosPrueba[codigo];if(!usuario){mensajeError.textContent="El código de acceso no es válido.";campos.forEach(c=>c.value="");campos[0].focus();return}localStorage.setItem("usuarioSesion",JSON.stringify(usuario));window.location.href="dashboard.html"});
</script>
</body>
</html>
