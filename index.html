<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Iniciar sesión | La Michoacana</title>

  <style>
    :root {
      --rosa: #ed2b85;
      --rosa-oscuro: #d91c70;
      --rosa-claro: #fff0f6;
      --amarillo: #ffd43b;
      --negro: #13111a;
      --gris: #6f6872;
      --borde: #e7dfe5;
      --blanco: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
      color: var(--negro);
      background: #f5f7fa;
    }

    button,
    input {
      font: inherit;
    }

    .login {
      width: 100%;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 53% 47%;
      background: var(--blanco);
    }

    /* LADO IZQUIERDO */

    .login-imagen {
      min-height: 100vh;
      padding: 58px 6vw 48px;
      position: relative;
      overflow: hidden;

      background-image:
        linear-gradient(
          90deg,
          rgba(255, 230, 239, 0.35),
          rgba(255, 175, 206, 0.05)
        ),
        url("imagenes/paletas-login.png");

      background-size: cover;
      background-position: center;
    }

    .contenido-imagen {
      min-height: calc(100vh - 106px);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      position: relative;
      z-index: 1;
    }

    .etiqueta {
      margin: 0 0 14px;
      color: var(--rosa);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .titulo-marca {
      margin: 0;
      font-size: clamp(2.5rem, 4.3vw, 4.8rem);
      line-height: 1;
      letter-spacing: -0.05em;
    }

    .frase-principal {
      margin: 20px 0 0;
      color: #342c34;
      font-size: 1.15rem;
      line-height: 1.5;
    }

    .detalle-amarillo {
      width: 72px;
      height: 6px;
      margin-top: 26px;
      border-radius: 999px;
      background: var(--amarillo);
      transform: rotate(-2deg);
    }

    .frase-inferior {
      margin: auto 0 0;
      color: var(--rosa-oscuro);
      font-size: 1.45rem;
      font-style: italic;
      line-height: 1.3;
    }

    /* LADO DERECHO */

    .login-acceso {
      min-height: 100vh;
      padding: 50px 7vw;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--blanco);
    }

    .formulario {
      width: 100%;
      max-width: 530px;
    }

    .logo {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 22px;
    }

    .logo-imagen {
      width: 130px;
      height: auto;
      display: block;
      object-fit: contain;

      /* Evita que se recorte */
      border: none;
      border-radius: 0;
      box-shadow: none;
    }

    .formulario h2 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 2rem;
      letter-spacing: -0.03em;
    }

    .instruccion {
      margin: 0 0 35px;
      color: var(--gris);
      text-align: center;
      line-height: 1.5;
    }

    .etiqueta-campo {
      display: block;
      margin-bottom: 10px;
      font-size: 0.9rem;
      font-weight: 750;
    }

    .codigo {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
    }

    .codigo input {
      width: 100%;
      min-width: 0;
      height: 62px;
      border: 1.5px solid var(--borde);
      border-radius: 13px;
      outline: none;
      background: var(--blanco);
      text-align: center;
      font-size: 1.4rem;
      font-weight: 800;
      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    .codigo input:focus {
      border-color: var(--rosa);
      box-shadow: 0 0 0 4px var(--rosa-claro);
    }

    .ayuda {
      margin: 10px 0 25px;
      color: var(--gris);
      font-size: 0.82rem;
    }

    .boton {
      width: 100%;
      min-height: 54px;
      border: none;
      border-radius: 13px;
      color: var(--blanco);
      background: var(--rosa);
      font-weight: 800;
      cursor: pointer;
      transition:
        background 0.2s,
        transform 0.2s;
      box-shadow: 0 9px 24px rgba(237, 43, 133, 0.2);
    }

    .boton:hover {
      background: var(--rosa-oscuro);
      transform: translateY(-1px);
    }

    .boton:active {
      transform: translateY(0);
    }

    .pie-login {
      margin-top: 35px;
      color: #989098;
      text-align: center;
      font-size: 0.82rem;
    }

    .mensaje-error {
      min-height: 21px;
      margin: 11px 0 0;
      color: #c8234d;
      font-size: 0.82rem;
    }

    /* TABLET */

    @media (max-width: 900px) {
      .login {
        grid-template-columns: 1fr;
      }

      .login-imagen {
        min-height: 370px;
        padding: 35px 7vw;
        background-position: center 58%;
      }

      .contenido-imagen {
        min-height: 300px;
      }

      .titulo-marca {
        font-size: 3rem;
      }

      .frase-inferior {
        display: none;
      }

      .login-acceso {
        min-height: auto;
        padding: 60px 7vw 70px;
      }
    }

    /* CELULAR */
    @media (max-width: 520px) {
      .login-imagen {
        min-height: 270px;
        padding: 28px 22px;
      }

      .contenido-imagen {
        min-height: 214px;
      }

      .titulo-marca {
        font-size: 2.25rem;
      }

      .frase-principal {
        font-size: 1rem;
      }

      .login-acceso {
        padding: 42px 22px 55px;
      }

      .logo-imagen {
        width: 110px;
      }

      .formulario h2 {
        font-size: 1.7rem;
      }

      .instruccion {
        margin-bottom: 28px;
      }

      .codigo {
        gap: 6px;
      }

      .codigo input {
        height: 53px;
        border-radius: 10px;
        font-size: 1.15rem;
      }
    }

    @media (max-width: 370px) {
      .codigo {
        gap: 4px;
      }

      .codigo input {
        height: 48px;
      }
    }
  </style>
</head>

<body>
  <main class="login">

    <!-- MITAD IZQUIERDA -->

    <section class="login-imagen">
      <div class="contenido-imagen">

        <p class="etiqueta">
          Sistema administrativo
        </p>

        <h1 class="titulo-marca">
          La Michoacana
        </h1>

        <p class="frase-principal">
          Tradición que endulza<br>
          cada momento
        </p>

        <div class="detalle-amarillo"></div>

        <p class="frase-inferior">
          Más que paletas,<br>
          es tradición
        </p>

      </div>
    </section>

    <!-- MITAD DERECHA -->

    <section class="login-acceso">
      <form class="formulario" id="formularioLogin">

        <div class="logo">
          <img
            src="imagenes/logogranpaleteria.jpeg"
            alt="Logo de Gran Paletería Michoacana"
            class="logo-imagen"
          >
        </div>

        <h2>Iniciar sesión</h2>

        <p class="instruccion">
          Ingresa tu código de acceso para continuar
        </p>

        <label
          class="etiqueta-campo"
          for="digito1"
        >
          Código de acceso
        </label>

        <div
          class="codigo"
          aria-label="Código de acceso de seis dígitos"
        >
          <input
            id="digito1"
            type="password"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="1"
            aria-label="Dígito 1"
            required
            autofocus
          >

          <input
            type="password"
            inputmode="numeric"
            maxlength="1"
            aria-label="Dígito 2"
            required
          >

          <input
            type="password"
            inputmode="numeric"
            maxlength="1"
            aria-label="Dígito 3"
            required
          >

          <input
            type="password"
            inputmode="numeric"
            maxlength="1"
            aria-label="Dígito 4"
            required
          >

          <input
            type="password"
            inputmode="numeric"
            maxlength="1"
            aria-label="Dígito 5"
            required
          >

          <input
            type="password"
            inputmode="numeric"
            maxlength="1"
            aria-label="Dígito 6"
            required
          >
        </div>

        <p class="ayuda">
          Código numérico de 6 dígitos
        </p>

        <button class="boton" type="submit">
          Iniciar sesión &nbsp; →
        </button>

        <p
          class="mensaje-error"
          id="mensajeError"
          aria-live="polite"
        ></p>

        <p class="pie-login">
          Acceso exclusivo para personal autorizado
        </p>

      </form>
    </section>

  </main>

  <script>
    const formulario = document.getElementById(
      "formularioLogin"
    );

    const campos = [
      ...document.querySelectorAll(".codigo input")
    ];

    const mensajeError = document.getElementById(
      "mensajeError"
    );

    campos.forEach((campo, posicion) => {
      campo.addEventListener("input", () => {
        campo.value = campo.value.replace(/\D/g, "");

        if (
          campo.value &&
          campos[posicion + 1]
        ) {
          campos[posicion + 1].focus();
        }

        mensajeError.textContent = "";
      });

      campo.addEventListener("keydown", (evento) => {
        if (
          evento.key === "Backspace" &&
          !campo.value &&
          campos[posicion - 1]
        ) {
          campos[posicion - 1].focus();
        }

        if (
          evento.key === "ArrowLeft" &&
          campos[posicion - 1]
        ) {
          campos[posicion - 1].focus();
        }

        if (
          evento.key === "ArrowRight" &&
          campos[posicion + 1]
        ) {
          campos[posicion + 1].focus();
        }
      });

      campo.addEventListener("paste", (evento) => {
        evento.preventDefault();

        const numeros = evento.clipboardData
          .getData("text")
          .replace(/\D/g, "")
          .slice(0, 6);

        numeros.split("").forEach((numero, indice) => {
          if (campos[indice]) {
            campos[indice].value = numero;
          }
        });

        const siguiente =
          campos[Math.min(numeros.length, 5)];

        if (siguiente) {
          siguiente.focus();
        }
      });
    });

    formulario.addEventListener("submit", (evento) => {
      evento.preventDefault();

      const codigo = campos
        .map((campo) => campo.value)
        .join("");

      if (codigo.length !== 6) {
        mensajeError.textContent =
          "Ingresa los seis números del código.";

        return;
      }

      const usuariosPrueba = {
        "123456": {
          id: 1,
          nombre: "Administrador",
          rol: "ADMINISTRADOR",
          sucursal: {
            id: 1,
            nombre: "Matriz · Zitácuaro"
          }
        },

        "654321": {
          id: 2,
          nombre: "Carlos Mendoza",
          rol: "EMPLEADO",
          sucursal: {
            id: 1,
            nombre: "Matriz · Zitácuaro"
          }
        }
      };

      const usuario = usuariosPrueba[codigo];

      if (!usuario) {
        mensajeError.textContent =
          "El código de acceso no es válido.";

        campos.forEach((campo) => {
          campo.value = "";
        });

        campos[0].focus();
        return;
      }

      localStorage.setItem(
        "usuarioSesion",
        JSON.stringify(usuario)
      );

      window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
